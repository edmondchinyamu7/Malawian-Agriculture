<!doctype html>
<html lang="ny">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#092d22">
  <title>Bwezeretsani Mawu Achinsinsi | Reset Password | Ulimi wa Malawi</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    body { margin: 0; background: #f4f7f4; color: #092d22; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .reset-wrap { min-height: calc(100vh - 76px); display: grid; place-items: center; padding: 32px 16px; box-sizing: border-box; }
    .reset-card { width: min(100%, 460px); box-sizing: border-box; background: #fff; border: 1px solid #dce8df; border-radius: 24px; padding: clamp(24px, 5vw, 38px); box-shadow: 0 16px 45px rgba(9, 45, 34, .09); }
    .reset-badge { width: 52px; height: 52px; border-radius: 16px; background: #eef6f0; border: 1px solid #c7e3d1; color: #0b6245; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 14px; }
    .reset-badge svg { width: 26px; height: 26px; }
    h1 { font-size: 24px; line-height: 1.25; color: #092d22; margin: 0 0 8px; font-weight: 850; }
    .muted { color: #556b5e; line-height: 1.55; font-size: 14px; }
    .field { display: block; width: 100%; box-sizing: border-box; padding: 13px 14px; border: 1px solid #cbd9cf; border-radius: 10px; margin: 8px 0 16px; font: inherit; font-size: 14px; color: #112d22; background: #fff; }
    .field:focus { outline: none; border-color: #0b6245; box-shadow: 0 0 0 3px rgba(11, 98, 69, .15); }
    .submit { width: 100%; padding: 14px; border: 0; border-radius: 10px; background: #0b6245; color: white; font-size: 15px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 14px rgba(11, 98, 69, .22); }
    .submit:disabled { opacity: .7; cursor: wait; }
    .alert { padding: 12px 14px; border-radius: 10px; margin-top: 14px; display: none; font-size: 13.5px; line-height: 1.45; }
    .alert.show { display: block; }
    .error { background: #fdf2f2; border: 1px solid #f8b4b4; color: #9b1c1c; }
    .success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
  </style>
</head>
<body>
  <header class="topbar" style="position:relative">
    <a class="brand" href="/index.html">
      <span class="brand-mark"><svg class="pro-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22v-8"/><path d="M12 14C6 14 3 10 3 4c6 0 9 3 9 10Z"/><path d="M12 17c0-5 3-8 9-8 0 5-3 8-9 8Z"/></svg></span>
      <span>ULIMI WA MALAWI<small>AKAUNTI YA MLIMI</small></span>
    </a>
    <a href="/login.html" style="color:#fff;font-weight:800;font-size:13px">← Bwererani ku Lowani / Return to Login</a>
  </header>

  <main class="reset-wrap">
    <section class="reset-card">
      <div class="reset-badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h1>Ikani mawu achinsinsi atsopano</h1>
      <p class="muted">Set a new password for your Ulimi wa Malawi account using the recovery link from your email.</p>
      <form id="resetForm">
        <label for="newPassword" style="font-size:13px;font-weight:750;color:#193d30">Mawu achinsinsi atsopano / New password (8+ characters)</label>
        <input class="field" id="newPassword" type="password" minlength="8" autocomplete="new-password" required>
        <label for="confirmPassword" style="font-size:13px;font-weight:750;color:#193d30">Tsimikizani mawu achinsinsi / Confirm new password</label>
        <input class="field" id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
        <button class="submit" id="saveBtn" type="submit">Sungani mawu achinsinsi atsopano / Save new password</button>
      </form>
      <div id="message" class="alert" role="status"></div>
      <p class="muted" style="margin-top:20px"><a href="/login.html" style="color:#0b6245;font-weight:750">← Bwererani ku Login / Return to login</a></p>
    </section>
  </main>

  <script type="module">
    import { supabase } from './js/auth.js';
    const form = document.getElementById('resetForm');
    const message = document.getElementById('message');
    const saveBtn = document.getElementById('saveBtn');

    function show(text, type = 'error') {
      message.textContent = text;
      message.className = 'alert show ' + type;
    }

    let recoverySession = false;

    async function checkRecovery() {
      const hash = new URLSearchParams(location.hash.slice(1));
      const query = new URLSearchParams(location.search);
      if (hash.get('error') || query.get('error')) {
        show(hash.get('error_description') || query.get('error_description') || 'Ulalo wobwezeretsa mawu achinsinsi watheka kapena siwolondola. Pemphani watsopano pa tsamba lolowera.');
        return;
      }
      const { data: { session } } = await supabase.auth.getSession();
      recoverySession = !!session;
      if (!recoverySession) {
        show('Ulalo wobwezeretsa watheka kapena sunatsegulidwe kuchokera mu imelo yanu. Bwererani ku login ndipo pemphani ulalo watsopano.');
      }
    }

    await checkRecovery();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const p = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;
      if (p.length < 8) { show('Gwiritsani ntchito zilembo zosachepera 8.'); return; }
      if (p !== confirm) { show('Mawu achinsinsi awiriwo sakugwirizana. (Passwords do not match.)'); return; }
      if (!recoverySession) { show('Sizinatheke kutsimikiza akaunti. Pemphani ulalo watsopano pa tsamba lolowera.'); return; }

      saveBtn.disabled = true;
      saveBtn.textContent = 'Ikusunga… / Saving…';
      try {
        const { error } = await supabase.auth.updateUser({ password: p });
        if (error) throw error;
        show('Mawu achinsinsi asinthidwa bwinobwino! Tsopano lowani ndi mawu anu atsopano.', 'success');
        await supabase.auth.signOut();
        setTimeout(() => location.assign('/login.html'), 1800);
      } catch (err) {
        show(err?.message || 'Zalephera kusintha mawu achinsinsi. Pemphani ulalo watsopano.');
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Sungani mawu achinsinsi atsopano / Save new password';
      }
    });
  </script>
</body>
</html>
