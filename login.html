<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#092d22"><title>Log In / Sign Up | Ulimi wa Malawi"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/components.css"><style>
body{min-height:100vh;background:#f3f7f3;display:grid;place-items:center;padding:24px}.auth-card{width:min(100%,470px);background:white;border:1px solid #dce8df;border-radius:24px;padding:clamp(24px,5vw,38px);box-shadow:0 20px 55px #092d221f}.auth-card h1{color:#092d22;margin:12px 0 8px}.auth-card p{color:#617368}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#edf4ef;padding:5px;border-radius:12px;margin:20px 0}.tabs button{border:0;padding:11px;border-radius:9px;background:transparent;font-weight:800;color:#315444}.tabs button.active{background:white;color:#0b6245}.field{margin:15px 0}.field label{display:block;font-weight:750;margin-bottom:7px;color:#193d30}.field input{width:100%;padding:13px;border:1px solid #cbd9cf;border-radius:10px;font:inherit}.submit{width:100%;padding:14px;border:0;border-radius:10px;background:#0b6245;color:white;font-weight:800}.message{min-height:24px;font-size:14px}.back{display:inline-block;margin-top:16px;color:#176747}[hidden]{display:none!important}</style></head><body><main class="auth-card"><div style="font-size:38px">🌱</div><span class="section-kicker">ULIMI WA MALAWI</span><h1 id="heading">Welcome back</h1><p id="intro">Sign in to your account.</p><div class="tabs"><button id="loginTab" class="active" type="button">Log In</button><button id="signupTab" type="button">Sign Up</button></div>
<form id="form"><div id="names" hidden><div class="field"><label for="first">First name</label><input id="first" maxlength="60"></div><div class="field"><label for="last">Surname</label><input id="last" maxlength="60"></div></div><div class="field"><label for="email">Email address</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label for="password">Password</label><input id="password" type="password" minlength="8" required autocomplete="current-password"></div><button class="submit" id="submit" type="submit">Log In</button><p class="message" id="message" role="status"></p></form><a class="back" href="index.html">← Return to website</a></main>
<script type="module">import{supabase}from'./js/auth.js';const $=id=>document.getElementById(id);let mode='login';function setMode(m){mode=m;$('names').hidden=m!=='signup';$('first').required=m==='signup';$('last').required=m==='signup';$('loginTab').classList.toggle('active',m==='login');$('signupTab').classList.toggle('active',m==='signup');$('heading').textContent=m==='login'?'Welcome back':'Create your account';$('intro').textContent=m==='login'?'Sign in to your account.':'Register with your first name, surname and email address.';$('submit').textContent=m==='login'?'Log In':'Create Account';$('message').textContent='';}$('loginTab').onclick=()=>setMode('login');$('signupTab').onclick=()=>setMode('signup');$('form').onsubmit=async e=>{e.preventDefault();const b=$('submit'),m=$('message');b.disabled=true;m.textContent='Please wait…';try{let r;if(mode==='signup'){r=await supabase.auth.signUp({email:$('email').value.trim(),password:$('password').value,options:{data:{first_name:$('first').value.trim(),last_name:$('last').value.trim()},emailRedirectTo:location.origin+'/login.html'}});if(r.error)throw r.error;if(!r.data.session){m.textContent='Account created. Check your email to confirm, then log in.';return;}}else{r=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;}const{data:{user}}=await supabase.auth.getUser();const{data:p,error}=await supabase.from('profiles').select('role').eq('id',user.id).single();if(error)throw error;if(p.role==='admin'){const{data:{session}}=await supabase.auth.getSession();const response=await fetch('/api/admin/session',{method:'POST',headers:{Authorization:'Bearer '+session.access_token},credentials:'same-origin'});if(!response.ok)throw Error('The server could not verify administrator access.');location.assign('/admin');}else location.assign('/profile.html');}catch(err){m.textContent=err.message||'Unable to sign in.';}finally{b.disabled=false;}};</script></body></html>
