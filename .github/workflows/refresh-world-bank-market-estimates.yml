name: Refresh World Bank Malawi Market Estimates

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: write

jobs:
  refresh-market-estimates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download and process World Bank estimates
        run: python scripts/update-world-bank-market-estimates.py

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data/world-bank-market-estimates.json; then
            echo "No market estimate changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/world-bank-market-estimates.json
          git commit -m "Refresh World Bank Malawi market estimates"
          git push
