name: Validate agriculture update upgrade

on:
  push:
    branches:
      - feature/malawi-agri-live-updates
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check scripts/collect-agri-updates.mjs
          node --check js/news-feed.js
      - name: Validate approved news data
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const data = JSON.parse(fs.readFileSync('data/agri-updates.json', 'utf8')); if (!Array.isArray(data.items)) throw new Error('items must be an array'); for (const item of data.items) { if (!item.title || !item.sourceUrl || !item.reviewStatus) throw new Error('Each news item needs title, sourceUrl and reviewStatus'); new URL(item.sourceUrl); } console.log('News JSON valid:', data.items.length, 'items');"
      - name: Build public website
        run: npm run build
