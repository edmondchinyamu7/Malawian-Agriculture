<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#092d22">
  <title>Administrator Sign In | Ulimi wa Malawi</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    body{min-height:100vh;background:#f3f7f3;display:grid;place-items:center;padding:24px}
    .login-card{width:min(100%,440px);background:#fff;border:1px solid #dce8df;border-radius:22px;padding:32px;box-shadow:0 20px 55px rgba(9,45,34,.12)}
    .login-mark{font-size:38px}.login-card h1{color:#092d22;margin:12px 0 8px;font-size:27px}
    .login-card p{color:#617368;line-height:1.6}.field{margin:18px 0}.field label{display:block;font-weight:700;margin-bottom:7px;color:#193d30}
    .field input{width:100%;padding:13px 14px;border:1px solid #cbd9cf;border-radius:10px;font:inherit}
    .login-submit{width:100%;border:0;border-radius:10px;padding:14px;background:#0b6245;color:white;font-weight:700;font-size:15px;cursor:pointer}
    .login-message{min-height:24px;margin:12px 0;color:#a12d25;font-size:14px}.back-link{display:inline-block;margin-top:18px;color:#176747}
  </style>
</head>
<body>
  <main class="login-card">
    <div class="login-mark" aria-hidden="true">🌱</div>
    <span class="section-kicker">ULIMI WA MALAWI • PRIVATE AREA</span>
    <h1>Administrator sign in</h1>
    <p>Enter your administrator credentials to continue to the management dashboard.</p>
    <form id="adminLoginForm">
      <div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button class="login-submit" type="submit">Sign in securely</button>
      <p class="login-message" id="loginMessage" role="status" aria-live="polite"></p>
    </form>
    <a class="back-link" href="/">← Return to website</a>
  </main>
  <script>
    const form=document.getElementById('adminLoginForm');
    const message=document.getElementById('loginMessage');
    form.addEventListener('submit',async event=>{
      event.preventDefault();
      message.textContent='Checking credentials…';
      const button=form.querySelector('button');
      button.disabled=true;
      try{
        const response=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});
        const result=await response.json();
        if(!response.ok) throw new Error(result.message||'Sign in failed.');
        window.location.assign('/admin');
      }catch(error){message.textContent=error.message;button.disabled=false;}
    });
  </script>
</body>
</html>
