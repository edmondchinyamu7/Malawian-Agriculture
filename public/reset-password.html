<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#092d22">
  <title>Reset password | Ulimi wa Malawi</title>
  <link rel="stylesheet" href="css/style.css?v=20261108-auth1">
  <link rel="stylesheet" href="css/components.css?v=20261108-auth1">
  <link rel="stylesheet" href="css/pages.css?v=20261108-auth1">
  <link rel="stylesheet" href="css/responsive.css?v=20261108-auth1">
  <style>
    body{margin:0;background:#f4f7f4;color:#092d22;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.reset-wrap{min-height:calc(100vh - 76px);display:grid;place-items:center;padding:32px 16px;box-sizing:border-box}
    .reset-card{width:min(100%,460px);box-sizing:border-box;background:#fff;border:1px solid #dce8df;border-radius:24px;padding:clamp(24px,5vw,38px);box-shadow:0 16px 45px rgba(9,45,34,.09)}
    h1{font-size:25px;line-height:1.25;color:#092d22;margin:0 0 8px;font-weight:850}.muted{color:#556b5e;line-height:1.5}.field{display:block;width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid #cbd9cf;border-radius:10px;margin:8px 0 16px;font:inherit;font-size:14px;color:#112d22;background:#fff}.field:focus{outline:none;border-color:#0b6245;box-shadow:0 0 0 3px rgba(11,98,69,.15)}
    .submit{width:100%;padding:14px;border:0;border-radius:10px;background:#0b6245;color:white;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(11,98,69,.22)}.submit:disabled{opacity:.7;cursor:wait}.alert{padding:12px;border-radius:10px;margin-top:14px;display:none}.alert.show{display:block}.error{background:#fdf2f2;color:#9b1c1c}.success{background:#f0fdf4;color:#166534}
  </style>
</head>
<body>
  <header class="topbar" style="position:relative"><a class="brand" href="/index.html"><span class="brand-mark">🌱</span><span>ULIMI WA MALAWI<small>FARMER ACCOUNTS · V18</small></span></a><a href="/login.html" style="color:#fff;font-weight:800;font-size:13px">← Return to Login</a></header>
  <main class="reset-wrap">
    <section class="reset-card">
      <div style="font-size:28px">🌱</div>
      <h1>Set a new password</h1>
      <p class="muted">Open this page using the password-reset link sent by Ulimi wa Malawi. Choose a new password for your account.</p>
      <form id="resetForm">
        <label for="newPassword">New password (at least 8 characters)</label>
        <input class="field" id="newPassword" type="password" minlength="8" autocomplete="new-password" required>
        <label for="confirmPassword">Confirm new password</label>
        <input class="field" id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
        <button class="submit" id="saveBtn" type="submit">Save new password</button>
      </form>
      <div id="message" class="alert" role="status"></div>
      <p class="muted" style="margin-top:20px"><a href="/login.html">Return to login</a></p>
    </section>
  </main>
  <script type="module">
    import { supabase } from './js/auth.js';
    const form=document.getElementById('resetForm');
    const message=document.getElementById('message');
    const saveBtn=document.getElementById('saveBtn');
    function show(text,type='error'){message.textContent=text;message.className='alert show '+type;}
    let recoverySession=false;
    async function checkRecovery(){
      const hash=new URLSearchParams(location.hash.slice(1));
      const query=new URLSearchParams(location.search);
      if(hash.get('error')||query.get('error')){
        show(hash.get('error_description')||query.get('error_description')||'This reset link is invalid or has expired. Request a new one from the login page.');
        return;
      }
      const {data:{session}}=await supabase.auth.getSession();
      recoverySession=!!session;
      if(!recoverySession) show('This reset link is invalid, expired, or has already been used. Return to login and request a new reset link.');
    }
    await checkRecovery();
    form.addEventListener('submit',async e=>{
      e.preventDefault();
      const p=document.getElementById('newPassword').value;
      const confirm=document.getElementById('confirmPassword').value;
      if(p.length<8){show('Use at least 8 characters.');return;}
      if(p!==confirm){show('The passwords do not match.');return;}
      if(!recoverySession){show('Your recovery session is missing. Request a fresh reset link from the login page.');return;}
      saveBtn.disabled=true;saveBtn.textContent='Saving…';
      try{
        const {error}=await supabase.auth.updateUser({password:p});
        if(error) throw error;
        show('Password updated successfully. You can now sign in with your new password.','success');
        await supabase.auth.signOut();
        setTimeout(()=>location.assign('/login.html'),1800);
      }catch(err){show(err?.message||'Could not update password. Request a new reset link.');}
      finally{saveBtn.disabled=false;saveBtn.textContent='Save new password';}
    });
  </script>
</body>
</html>
